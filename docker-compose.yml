services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: longrun-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override the .env defaults so the container reaches the other
      # containers by service name instead of localhost.
      DATABASE_URL: postgresql://longrun:longrun@postgres:5432/longrun
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    container_name: longrun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: longrun
      POSTGRES_PASSWORD: longrun
      POSTGRES_DB: longrun
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longrun"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: longrun-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
